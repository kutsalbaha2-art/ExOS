lang tr_TR.UTF-8
keyboard trq
timezone Europe/Istanbul --utc
selinux --disabled
firewall --enabled

# Ağ Kartını Otomatik Aktifleştirme (URL Kullanımı İçin Zorunlu)
network --bootproto=dhcp --device=link --activate

zerombr
clearpart --all --initlabel
part / --size=10240 --fstype=ext4
bootloader --location=mbr
rootpw --plaintext exos

url --url="https://dl.fedoraproject.org/pub/fedora/linux/releases/41/Everything/x86_64/os/"
repo --name="updates" --baseurl="https://dl.fedoraproject.org/pub/fedora/linux/updates/41/Everything/x86_64/"

%packages
@core
@base-x
dracut-live
dracut-network
grub2-tools-extra
isolinux
syslinux
calamares
qt6-qtbase
xcb-util-cursor
libxkbcommon-x11
plasma-desktop
sddm
NetworkManager
git
python3
%end

%post
systemctl enable NetworkManager.service
systemctl enable sddm.service
%end
