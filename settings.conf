---
# Calamares Ana Yapılandırma Dosyası (ExOs)

# 1. MODÜL VE BRANDING ARAMA YOLLARI
modules-search:
  - local
  - /usr/lib/calamares/modules
  - /usr/lib64/calamares/modules

instances: []

# 2. SEÇİLEN MARKA (BRANDING)
branding: exos

# 3. CALAMARES ÇALIŞMA MODLARI
prompt-at-start: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false

# 4. KURULUM SIRA AKIŞI (SEQUENCE)
sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - exos_hardware
      - displaymanager
      - umount
  - show:
      - finished
