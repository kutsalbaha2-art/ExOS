---
modules-search:
  - local
  - /usr/lib/calamares/modules
  - /usr/lib64/calamares/modules

branding: exos

prompt-at-start: false
dont-chroot: false

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - exos_hardware
      - umount
  - show:
      - finished
